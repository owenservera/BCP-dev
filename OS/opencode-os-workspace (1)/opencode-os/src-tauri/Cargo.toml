[package]
name = "opencode-os"
version = "0.1.0"
edition = "2021"
description = "OpenCode OS — a Windows-style desktop shell for the OpenCode CLI"
default-run = "opencode-os"

[lib]
name = "opencode_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/opencode-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opencode-core = { path = "crates/opencode-core" }

[profile.release]
strip = true
lto = true
codegen-units = 1
