name: Windows Installer

# Builds the consumer Windows installers (NSIS .exe + MSI) for OpenCode OS.
# - every push to main: artifacts attached to the workflow run
# - every tag v*: artifacts attached to a GitHub Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable, ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run core Rust tests
        working-directory: src-tauri/crates/opencode-core
        run: cargo test --release

      - name: Run frontend unit tests
        run: npm test

      - name: Build Tauri installers (NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('OpenCode OS {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/v') }}
          includeUpdaterJson: false

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-os-windows-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
