name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-and-frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust core tests (fs sandbox, server lifecycle, stream parser, settings)
        working-directory: src-tauri/crates/opencode-core
        run: cargo test
      - name: Frontend unit tests (path utils, WM geometry, chat parser)
        run: npm test
      - name: Bridge server API tests (real HTTP, fake CLI)
        run: node --test tests/bridge.test.mjs

  linux-build-check:
    # Proves the full Tauri app compiles (sandbox dev machines may lack
    # webkit2gtk; CI has root and can install the real deps).
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tauri-apps/tauri/ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Debug build of the Tauri app
        working-directory: src-tauri
        run: cargo build
