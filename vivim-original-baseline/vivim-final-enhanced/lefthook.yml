# lefthook.yml — Git hooks for vivim-final
# Install: bun x lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.ts"
      run: bun x @biomejs/biome lint {staged_files}
    format:
      glob: "*.{js,ts,json,md}"
      run: bun x @biomejs/biome check --write {staged_files}
    bundles-txt:
      # Cheap sync: refresh .txt copies from existing bundles (skips when none exist).
      run: pwsh scripts/bundles/sync-txt-copies.ps1
    guard:
      # Refuse to commit while servers run (orphan risk) or a migration is pending.
      run: bun run devops runtime-test guard
    typecheck:
      glob: "*.ts"
      run: bun run typecheck

pre-push:
  commands:
    audit:
      run: bun audit --audit-level=high
      # Blocks push if high/critical CVEs present (enhancement #1)
    bundles:
      # Regenerate bundles + .txt copies before every push (git-ignored; versioned via CI artifacts).
      run: pwsh scripts/bundles/build-bundles.ps1 && pwsh scripts/bundles/sync-txt-copies.ps1
