# BCP-SPEED Capability Map — 14 families x 49 sub-capabilities (REAL PROJECT)
# PRIMARY STORE. Agents read this to know what exists and its depth.
# Depth scale: L0 (spec) -> L1 (stub) -> L2 (works) -> L3 (hardened)
# Tracks TWO repos: FAM-01..06 = omega-final (the LANDING forge);
# FAM-10..14 = vivim-final-enhanced (the PROTOTYPE app).
# Plus THREE experiment tracks (seeded 2026-09-22, owner-directed, require_human):
# FAM-07 = Path A Chrome skeleton (fresh W5, Chrome-only per D-418/D-456);
# FAM-08 = Path B Intent Fabric (deterministic NL control plane);
# FAM-09 = Path C Airlock (legacy smelt, bridges to prototype storage only).
# FAM-07/08 are fresh-plan tracks with no external REQUIRES; FAM-09.1
# REQUIRES prototype-side FAM-11.1 only. No edges touch FAM-01..06.
# Seed depths are honest claims (landed/ratified = L2, frontier = L0/L1);
# the crew verifies upward to L3 with evidence, never by fiat.
