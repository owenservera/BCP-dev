# Dependency edges: typed constraints on build order.
# edge_type: REQUIRES | BLOCKS | ENABLES | SUPERSEDES | CONFLICTS
# `source REQUIRES target` means the SOURCE depends on the TARGET: the source
# cannot be leased or advanced until the target has reached required_depth.
# FAM-01..06 track omega-final (LANDING); FAM-10..14 track
# vivim-final-enhanced (PROTOTYPE). No cross-repo REQUIRES edges: the two
# tracks build in parallel; the landing receives the prototype, it never
# blocks it.
# FAM-07/08 (seeded 2026-09-22, Paths A/B) are fresh-plan tracks: internal
# REQUIRES only, no external edges. FAM-09.1 (Path C Airlock) REQUIRES
# prototype-side FAM-11.1 only — the single bridge edge, landing untouched.
