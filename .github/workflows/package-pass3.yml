name: Package VIVIM System Intelligence Pass 3
on:
  push:
    branches:
      - pack/system-intelligence-pass3
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pass 3 ZIP
        run: |
          set -e
          rm -rf /tmp/pass3
          mkdir -p /tmp/pass3
          cp -R docs/destination/system-intelligence/pass-3 /tmp/pass3/pass-3
          printf '%s\n' '# VIVIM System Intelligence — Pass 3 Full Pack' '' 'Source: owenservera/BCP-dev' 'Branch: research/system-intelligence-pass3' 'Tip: 0121570c005112eb8875e9b8a6f484cc732d4e62' '' 'Contains the complete Pass 3 characterization/design artifacts and five machine-readable indexes.' > /tmp/pass3/PACK-README.md
          printf '%s\n' '{' '  "repository": "owenservera/BCP-dev",' '  "sourceBranch": "research/system-intelligence-pass3",' '  "pass2Base": "bc07a9434728dad768ef6bc946bea1264e10b48b",' '  "pass3Tip": "0121570c005112eb8875e9b8a6f484cc732d4e62",' '  "artifactCount": 20,' '  "productionCodeChanged": false,' '  "omegaLawChanged": false,' '  "pass1OrPass2Modified": false' '}' > /tmp/pass3/REPOSITORY-METADATA.json
          cd /tmp/pass3
          zip -qr "$GITHUB_WORKSPACE/vivim-system-intelligence-pass3-full.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: vivim-system-intelligence-pass3-full
          path: vivim-system-intelligence-pass3-full.zip
