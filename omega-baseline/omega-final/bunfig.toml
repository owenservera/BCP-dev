# bun test runs serially here, and that is a deliberate safety measure.
#
# WHY. On this machine a full `bun test` at Bun's default concurrency
# (`max(4, min(20, cpus))`) ends in a runtime crash, not an assertion failure:
#
#   panic(thread N): Stack overflow
#   "This indicates a bug in Bun, not your code."
#
# after roughly 1500 passing tests. Bisected at OMEGA_TEST_CONCURRENCY=1, every
# area is clean — host 86, plugins 762, testkit/contracts/sdk/packs 163,
# surfaces 70, tooling 466 — and the full suite then completes in 326s with
# 1586 pass / 2 skip / 3 fail and no crash. The crash is a property of the
# runner's concurrency, not of any test in this repo. See gap G-08 / task T-23
# in ../../../.zcode/board/GAP-LEDGER.md.
#
# The suite also spawns stdio JSON-RPC servers and vault daemons; stacking two
# runs exhausts Windows handles and takes the host client down with it.
#
# The cost of serial is small — 326s against a 302s default-concurrency run that
# survived — and the cost of not doing it is a crashed machine. Set
# OMEGA_TEST_CONCURRENCY in the environment to override this deliberately, e.g.
# to bisect G-08. tooling/gates/gate.ts already honours that variable.
[test]
maxConcurrency = 1